<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Piano Song Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: song list on the left, one big labeled keyboard on top of each song, notes by line below. Keys stay ivory in both themes, like a real piano. Purple = the note to play next. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --ink:#17202A; --muted:#5B6773; --line:#D8DFE5; --hover:#E8EDF1;
  --accent:#0E6B75; --accent-ink:#FFFFFF;
  --btn:#E8EDF1; --btn-ink:#17202A; --btn-line:#AEB9C3; --btn-hover:#D5DDE4; --btn-off:#CBD3DA; --btn-off-ink:#4B5762;
  --key:#FCFBF7; --key-edge:#8E98A2; --key-ink:#27303A; --key-mute:#5E6872; --key-black:#1B2229;
  --used:#F7E3AE; --mid:#F6CC70;
  --cur:#7C3AED; --cur-edge:#3B1380; --cur-ink:#FFFFFF;
  --live:#2BC4A8; --live-bk:#0F9D86; --good:#3DDC84; --good-bk:#1FA85F; --bad:#F2646A; --bad-bk:#D43B42;
  --font-display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;
  --font-body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#192027; --ink:#E6ECF1; --muted:#9AA7B3; --line:#2A343D; --hover:#222B33;
    --accent:#4FC0CC; --accent-ink:#06242A;
    --key:#EFECE4; --key-edge:#6C757E; --key-black:#0B0F13;
    --used:#E6CE8C; --mid:#EDB955;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192027; --ink:#E6ECF1; --muted:#9AA7B3; --line:#2A343D; --hover:#222B33;
  --accent:#4FC0CC; --accent-ink:#06242A;
  --key:#EFECE4; --key-edge:#6C757E; --key-black:#0B0F13;
  --used:#E6CE8C; --mid:#EDB955;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font-body);
  padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.app{display:grid; grid-template-columns:240px minmax(0,1fr); gap:24px; max-width:1040px; margin:0 auto; align-items:start}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.side-h{margin:0 0 10px; font:700 18px/1.2 var(--font-display)}
.nav{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.nav a{display:block; padding:10px 12px; border-radius:8px; color:var(--ink); text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav .t{display:block; font-weight:600}
.nav .m{display:block; font-size:13px; color:var(--muted)}
.nav a[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.nav a[aria-current="page"] .m{color:inherit; opacity:.88}
.side-note{margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); font-size:14px; color:var(--muted)}
.main{min-width:0; display:grid; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.board{display:grid; gap:12px}
.board-h{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
h1{margin:0; font:700 26px/1.15 var(--font-display); text-wrap:balance}
.seg{display:inline-flex; border:1px solid var(--btn-line); border-radius:8px; overflow:hidden}
.tabs{display:flex; width:100%; margin-bottom:12px}
.tabs button{flex:1}
.seg span{padding:8px 10px; font-size:13px; color:var(--muted); display:flex; align-items:center}
.seg button{font:inherit; font-size:14px; padding:8px 12px; border:0; border-left:1px solid var(--btn-line); background:var(--btn); color:var(--btn-ink); cursor:pointer; min-height:40px}
.seg button:first-child{border-left:0}
.seg button:hover:not([aria-pressed="true"]){background:var(--btn-hover)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.sheet{background:#FCFBF7; border:1px solid var(--key-edge); border-radius:10px; padding:4px 0; display:flex; min-width:0}
.sheet[hidden]{display:none}
.sh-fixed{flex:none}
.sh-scroll{flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch}
.sheet svg{display:block; max-width:none}
.sheet .sline{stroke:#59636D; stroke-width:1.3}
.sheet .clef{fill:none; stroke:#27303A; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.sheet .nh{fill:#1B2229; cursor:pointer}
.sheet .stem{stroke:#1B2229; stroke-width:1.6}
.sheet .acc{font:500 27px var(--font-body); fill:#1B2229}
.sheet .sl{font:500 22px var(--font-mono); fill:#27303A; cursor:pointer}
.sheet .sw{font:500 14px var(--font-body); fill:#5E6872}
.sheet .pl{font:700 15px var(--font-mono); fill:#27303A}
.sheet .pl-space{font-weight:500; fill:#0E6B75}
.sheet .pl-led{fill:#7A858F}
.sheet .past{opacity:.35}
.sheet .hl{fill:var(--cur); opacity:.14}
.sheet .cur .nh{fill:var(--cur); stroke:var(--cur-edge); stroke-width:1.5}
.sheet .cur .stem{stroke:var(--cur-edge)}
.sheet .cur .acc,.sheet .cur .sl{fill:var(--cur-edge); font-weight:600}
.sheet .cur .sw{fill:var(--cur-edge); font-weight:600}
.board[data-labels="c"] .sheet .sl:not(.isC){display:none}
.board[data-labels="off"] .sheet .sl{display:none}
.kb{display:block; width:100%; height:auto; margin-inline:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.wk{fill:var(--key); stroke:var(--key-edge); stroke-width:1; cursor:pointer}
.wk.song{fill:var(--mid)}
.wk.cur{fill:var(--cur); stroke:var(--cur-edge); stroke-width:3.5}
.wk.live{fill:var(--live)}
.wk.good{fill:var(--good)}
.wk.bad{fill:var(--bad)}
.bk{fill:var(--key-black); cursor:pointer}
.bk.song{fill:#9A6B0F}
.bk.cur{fill:var(--cur); stroke:var(--cur-edge); stroke-width:3}
.bl{font:500 13px var(--font-mono); fill:#C9D1D8; pointer-events:none}
.bl.on{fill:var(--cur-ink)}
.board[data-labels="off"] .bl{display:none}
.board[data-labels="c"] .bl{display:none}
.bk.live{fill:var(--live-bk)}
.bk.good{fill:var(--good-bk)}
.bk.bad{fill:var(--bad-bk)}
.kl{font:500 24px var(--font-mono); fill:var(--key-ink); pointer-events:none}
.kl.on{fill:var(--cur-ink)}
.ks{font:500 13px var(--font-body); fill:var(--key-mute); pointer-events:none}
.ks.on{fill:var(--cur-ink); font-weight:600}
.fn{font:500 18px var(--font-mono); fill:#8A939C; pointer-events:none}
.fn.on{fill:var(--cur-ink); opacity:.8}
.board[data-labels="off"] .fn{display:none}
.hbtns{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.btn.go{background:var(--cur); border-color:var(--cur-edge); color:var(--cur-ink); font-weight:600}
.btn.go:hover:not(:disabled){background:var(--cur-edge)}
.board[data-labels="c"] .kl:not(.isC){display:none}
.board[data-labels="off"] .kl,.board[data-labels="off"] .ks{display:none}
.statusrow{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.status{margin:0; min-width:0; font-size:15px; color:var(--muted)}
.status b{font:500 20px var(--font-mono); color:var(--ink); margin-right:4px}
.btns{display:flex; gap:8px}
.btn{font:inherit; font-size:15px; padding:8px 14px; min-height:40px; border:1px solid var(--btn-line); background:var(--btn); color:var(--btn-ink); border-radius:8px; cursor:pointer}
.btn:hover:not(:disabled){background:var(--btn-hover)}
.btn:disabled,.btn.go:disabled{background:var(--btn-off); color:var(--btn-off-ink); border-color:var(--btn-line); cursor:default}
.btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tools{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:12px; border-top:1px solid var(--line)}
.midi{margin:0; font-size:14px; color:var(--muted)}
.key-legend{margin:0; display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--muted)}
.key-legend span{display:inline-flex; align-items:center; gap:6px}
.key-legend i{width:12px; height:12px; border-radius:3px; border:1px solid var(--key-edge); display:inline-block}
.lines{padding:4px 16px}
.line{display:grid; grid-template-columns:64px minmax(0,1fr); gap:8px 12px; padding:12px 0; border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.lh{margin:0; padding-top:12px; font:500 13px var(--font-mono); letter-spacing:.04em; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:grid; justify-items:center; align-content:start; gap:2px; min-width:46px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.chip:hover{background:var(--hover)}
.chip .n{font:500 22px/1.1 var(--font-mono)}
.chip .n sup{font-size:12px; margin-left:1px}
.chip .w{font-size:12px; color:var(--muted); min-height:16px; line-height:16px}
.chip.done{opacity:.5}
.chip[aria-pressed="true"]{background:var(--cur); border-color:var(--cur-edge); color:var(--cur-ink); opacity:1}
.chip[aria-pressed="true"] .w{color:var(--cur-ink)}
.tips h2,.card h2{margin:0 0 8px; font:700 17px/1.25 var(--font-display)}
.tips ul{margin:0; padding-left:20px; display:grid; gap:4px}
.legend{margin:0 0 10px; font-size:14px; color:var(--muted)}
.card p{margin:0 0 10px}
.links{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.links a{color:var(--accent); font-weight:600}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr); gap:16px}
  .side{position:static; padding:10px}
  .side-h,.side-note,.nav .m{display:none}
  .nav{display:flex; overflow-x:auto; gap:8px; padding-bottom:4px}
  .nav a{white-space:nowrap; padding:8px 12px; border:1px solid var(--line)}
  .nav a[aria-current="page"]{border-color:var(--accent)}
  h1{font-size:22px}
  .line{grid-template-columns:minmax(0,1fr)}
  .lh{padding-top:0}
}
</style>

    </section>
    <div id="notes"></div>
  </main>
</div>

    {id:'fur-elise',name:'Für Elise (easy)',meta:'15 lines · right hand only',range:['C4','F5'],base:4,

      tips:['Right hand only, no chords. Read from the score page (Poco moto). Lines 1 to 6 are the opening tune, lines 7 to 15 continue it',

    {id:'baby-shark',name:'Baby Shark',meta:'links only',range:['C4','C5'],base:4,lines:[],

      noteOn('m'+n,n+midiShift,v,null,n);
    }
    else if(st===0x80||(st===0x90&&v===0)) noteOff('m'+n);
    else if(st===0xB0&&n===123){ Object.keys(held).forEach(function(k){if(k.charAt(0)==='m') delete held[k];}); paint(); }
  }

  function bindInputs(){
    var names=[];
    midiAccess.inputs.forEach(function(inp){inp.onmidimessage=onMsg; names.push(inp.name||'MIDI input');});
    midiNames=names; midiBase=names.length?'ready':'nodevice'; setMidi();
  }
  function midiBtn(){
    var b=$('midi'), was=false;
    try{was=localStorage.getItem('pn-midi')==='1';}catch(e){}
    b.textContent=(midiBase==='ready'||midiBase==='nodevice'||was)?'Reconnect MIDI':'Connect MIDI';
  }
  var setMidiBase=setMidi;
  setMidi=function(){ setMidiBase(); midiBtn(); };
  function connectMidi(){
    if(!navigator.requestMIDIAccess){ midiBase='unsupported'; setMidi(); return; }
    /* drop old listeners so a reconnect never plays every note twice */
    if(midiAccess){ try{ midiAccess.inputs.forEach(function(i){i.onmidimessage=null;}); midiAccess.onstatechange=null; }catch(e){} midiAccess=null; }
    held={}; midiBase='connecting'; setMidi();
    var p;
    try{ p=navigator.requestMIDIAccess(); }catch(e){ midiBase='blocked'; setMidi(); return; }
    p.then(function(acc){ midiAccess=acc; acc.onstatechange=bindInputs; save('pn-midi','1'); bindInputs(); }).catch(function(){ midiBase='blocked'; setMidi(); });
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&midiAccess) bindInputs(); });

  var ptrs={};
  kbwrap.addEventListener('pointerdown',function(e){
    var el=e.target.closest&&e.target.closest('.wk,.bk'); if(!el) return;
    var s=+el.dataset.s, key=null, i;
    for(i=0;i<keys.length;i++) if(keys[i].el===el) key=keys[i];
    ptrs[e.pointerId]='p'+e.pointerId;
    noteOn('p'+e.pointerId,s+12,100,key);
  });
  function ptrUp(e){ if(ptrs[e.pointerId]){ noteOff(ptrs[e.pointerId]); delete ptrs[e.pointerId]; } }
  document.addEventListener('pointerup',ptrUp);
  document.addEventListener('pointercancel',ptrUp);

  function step(d){
    var s=cur; if(!s.lines.length) return;
    if(finished){ if(d<0){finished=false; paint();} return; }
    var l=li==null?0:li, n=ni==null?(d>0?-1:0):ni;
    n+=d;
    if(n<0){ if(l>0){l--; n=s.lines[l].n.length-1;} else n=0; }
    else if(n>=s.lines[l].n.length){ if(l<s.lines.length-1){l++; n=0;} else n=s.lines[l].n.length-1; }
    li=l; ni=n; paint();
  }

  notes.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b) return;
    li=+b.dataset.l; ni=+b.dataset.n; finished=false; paint();
  });
  prevB.addEventListener('click',function(){step(-1);});
  nextB.addEventListener('click',function(){step(1);});
  $('start').addEventListener('click',function(){
    if(!cur.lines.length) return;
    li=0; ni=0; finished=false; started=false;
    if(!follow){follow=true; save('pn-follow','1');}
    paint();
  });
  $('follow').addEventListener('click',function(){ follow=!follow; save('pn-follow',follow?'1':'0'); paint(); });
  $('slab').addEventListener('click',function(){ sLab=!sLab; save('pn-slab',sLab?'1':'0'); paint(); });
  $('midi').addEventListener('click',connectMidi);
  $('octshift').addEventListener('click',function(){
    var order=[0,12,24,-24,-12], k=order.indexOf(midiShift); midiShift=order[(k+1)%order.length];
    save('pn-shift',String(midiShift)); pendingFix=null; $('fixoct').hidden=true; paint();
  });
  $('fixoct').addEventListener('click',function(){
    if(pendingFix==null) return;
    midiShift=Math.max(-24,Math.min(24,midiShift+pendingFix)); save('pn-shift',String(midiShift));
    pendingFix=null; $('fixoct').hidden=true;
    if(follow&&expected()) advance();
    lastText='Octave adjusted. Keep playing from the highlighted note.'; setMidi(); paint();
  });
  $('labseg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    mode=b.dataset.m; save('pn-labels',mode); paint();
  });
  $('octseg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    octMode=b.dataset.o; save('pn-oct2',octMode); paint();
  });

  function route(){
    var id=(location.hash||'').slice(1), s=SONGS[0], k;
    for(k=0;k<SONGS.length;k++) if(SONGS[k].id===id) s=SONGS[k];
    tab=s.tab||'p'; renderNav();
    render(s);
  }
  $('tabs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||b.dataset.t===tab) return;
    var k, first=null;
    for(k=0;k<SONGS.length;k++) if((SONGS[k].tab||'p')===b.dataset.t){first=SONGS[k];break;}
    if(first){ if(location.hash==='#'+first.id) route(); else location.hash=first.id; }
  });
  window.addEventListener('hashchange',route);
  route();
  setMidi();
  try{ if(localStorage.getItem('pn-midi')==='1') connectMidi(); }catch(e){}
  try{
    if(navigator.permissions&&navigator.permissions.query&&navigator.requestMIDIAccess){
      navigator.permissions.query({name:'midi'}).then(function(r){ if(r.state==='granted') connectMidi(); }).catch(function(){});
    }
  }catch(e){}
})();
</script>
</body></html>
